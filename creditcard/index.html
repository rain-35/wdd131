<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Rainen">
    <!-- add description -->
    <meta name="description" content="credit card form"> 
    <!-- add normalize -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <!-- add stylesheet -->
    <link rel="stylesheet" href="style.css">
    <!-- add script -->
    <script src="script.js" defer></script>
    <!-- add icon -->
    <link rel="icon" href="favicon.ico">
    <!-- add title -->
    <title>Credit Card</title>
</head>
<body>
    <div id="content">
        <header>

        </header>
        <main>
            <div id="form">

                <div class="card" id="front_card">
                    <p id="title" class="field_lable"> TOTAL: $199</p>

                    <p id="card_icon">💳</p>

                    <div id="cardNumber">
                        <label for="card_number_label">CARD NUMBER</label>
                        <input class="input_box" type="number" id="card_number" name="card_number" placeholder="1234 5678 9101 1020" required aria-labelledby="card_number_label">
                    </div>

                    <div id="cardHolder">
                        <label for="card_holder_label">CARD HOLDER</label>
                        <input class="input_box" type="text" id="card_holder" name="card_holder_name" placeholder="John Doe" required aria-labelledby="card_holder_label">
                     
                    </div>

                    <div id="cardExpiration">
                        <label for="expirationDate">EXPIRATION</label>
                        <input class="input_box" type='text' id='month' name="expMonth" placeholder="MM" required aria-labelledby="expirationDate">
                        <input class="input_box" type='text' id='year' name="expYear" placeholder="YY" required aria-labelledby="expirationDate">
                    </div>


                </div>
                <div class="card" id="back_card">

                </div>

            </div>

        </main>
        <footer>

        </footer>

    </div>
    
</body>
</html>
